<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SocialLens HUD</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="hud-status" id="status"></div>
<div class="hud-stage">
  <div class="hud-panel hud-empty" id="panel"></div>
</div>
<script src="api.js"></script>
<script type="module">
import { renderHud } from "./hud.js";

const panel = document.getElementById("panel");
const statusEl = document.getElementById("status");
const params = new URLSearchParams(location.search);
const sessionId = params.get("session") || "sample";

function setStatus(text) {
  statusEl.textContent = text;
}

/** A message is {event, hud}. hud is null for "nothing new to show" (e.g. a
 * deduped repeat) -- the current cue, if any, is left on screen until its own ttl. */
function handleMessage(msg) {
  if (msg && msg.hud) renderHud(panel, msg.hud);
}

// window.SocialLensApi (api.js) owns the mock-vs-live switch (its own ?mock=1
// check) and the WS/replay transport, so a live session here mirrors the same
// cues live.html shows, and a mock session replays contracts/fixtures/ws_stream.jsonl.
setStatus(window.SocialLensApi.MOCK ? "mock replay" : `connecting to ${sessionId}…`);
const handle = window.SocialLensApi.openWs(sessionId, (msg) => {
  setStatus(window.SocialLensApi.MOCK ? "mock replay" : `session ${sessionId}`);
  handleMessage(msg);
});

window.addEventListener("beforeunload", () => handle.close());
</script>
</body>
</html>
