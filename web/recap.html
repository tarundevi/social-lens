<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SocialLens Recap</title>
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="recap-page">
<div class="recap-header">
  <h1>Catch me up</h1>
  <button class="recap-btn" id="replay-btn">Replay</button>
  <button class="recap-btn" id="catchup-btn">Catch me up</button>
</div>
<div class="recap-status" id="status"></div>
<div id="catchup-panel"></div>

<div class="recap-section">
  <h2>Tone over time</h2>
  <canvas id="tone-chart" height="80"></canvas>
</div>

<div class="recap-section">
  <h2>Sound &amp; social cue markers</h2>
  <div class="marker-strip" id="markers"></div>
</div>

<div class="recap-section">
  <h2>Speakers</h2>
  <div id="lanes"></div>
</div>

<script type="module">
import { parseJsonl, buildLanes, buildToneChart, buildMarkers, replay, renderRecap, fetchRecap } from "./recap.js";

const params = new URLSearchParams(location.search);
const sessionId = params.get("session") || "sample";
const statusEl = document.getElementById("status");
const catchupPanel = document.getElementById("catchup-panel");

function unwrap(line) {
  return line.event ? Object.assign({}, line.event, { _replay_t: line._replay_t }) : line;
}

const MOCK = params.get("mock") === "1";

async function loadMockSample() {
  const [sessionText, speakersRes] = await Promise.all([
    fetch("mock/sample_session.jsonl").then((r) => r.text()),
    fetch("mock/speakers.json").then((r) => r.json()),
  ]);
  return { events: parseJsonl(sessionText).map(unwrap), speakers: speakersRes };
}

async function loadEvents() {
  // Real backend first (GET /api/sessions/sample/events serves data/sample_session.jsonl,
  // including its social_cue events). Static mock copy only with ?mock=1 or if the API is down.
  if (MOCK) return loadMockSample();
  try {
    const r = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/events`);
    if (!r.ok) throw new Error(`events ${r.status}`);
    const eventsRes = await r.json();
    const speakersRes = await fetch("mock/speakers.json").then((x) => x.json()).catch(() => ({ speakers: {} }));
    return { events: (eventsRes.events || []).map(unwrap), speakers: speakersRes };
  } catch (err) {
    if (sessionId !== "sample") throw err;
    console.warn("[recap] API unavailable, using mock sample", err);
    return loadMockSample();
  }
}

let state = { events: [], speakers: {} };
let chart = null;

function renderAll() {
  const lanesEl = document.getElementById("lanes");
  const markersEl = document.getElementById("markers");
  buildLanes(lanesEl, state.events, state.speakers);
  buildMarkers(markersEl, state.events);
  if (chart) chart.destroy();
  chart = buildToneChart(document.getElementById("tone-chart"), state.events);
}

loadEvents()
  .then((loaded) => {
    state = loaded;
    statusEl.textContent = `session: ${sessionId} (${state.events.length} events)`;
    renderAll();
  })
  .catch((err) => {
    statusEl.textContent = `failed to load session: ${err}`;
  });

document.getElementById("replay-btn").addEventListener("click", () => {
  document.getElementById("lanes").innerHTML = "";
  document.getElementById("markers").innerHTML = "";
  if (chart) chart.destroy();
  chart = buildToneChart(document.getElementById("tone-chart"), []);
  const seen = [];
  replay(state.events, (e) => {
    seen.push(e);
    buildLanes(document.getElementById("lanes"), seen, state.speakers);
    buildMarkers(document.getElementById("markers"), seen);
    if (chart) chart.destroy();
    chart = buildToneChart(document.getElementById("tone-chart"), seen);
  });
});

document.getElementById("catchup-btn").addEventListener("click", async () => {
  statusEl.textContent = "Loading catch-me-up…";
  try {
    let recap;
    if (MOCK) {
      recap = await fetchRecap(sessionId, { mockFixtureUrl: "mock/recap.json" });
    } else {
      // POST /api/recap: Grok with a key, labeled heuristic without one.
      recap = await fetchRecap(sessionId).catch((err) => {
        if (sessionId !== "sample") throw err;
        return fetchRecap(sessionId, { mockFixtureUrl: "mock/recap.json" });
      });
    }
    renderRecap(catchupPanel, recap);
    statusEl.textContent = `session: ${sessionId}`;
  } catch (error) {
    statusEl.textContent = `catch-me-up failed: ${error}`;
  }
});
</script>
</body>
</html>
